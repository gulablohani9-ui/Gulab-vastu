<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gulab Vastu Chakra</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8;font-family:Arial,sans-serif}
#top{height:85px;padding:33px 10px 0 10px;background:#ffffff;display:flex;align-items:center;gap:8px;box-sizing:border-box;box-shadow:0 1px 5px #0002;position:relative;z-index:10}
#top .title{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{border:1px solid #d8dce3;background:#fff;border-radius:9px;padding:8px 11px;font-size:13px;font-weight:600}
button:active{background:#eef2f7}
#ggb{position:absolute;left:0;right:0;top:85px;bottom:0;background:#fff}
#file{display:none}
#hint{position:absolute;left:10px;right:10px;bottom:10px;background:#111c;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;z-index:8;display:none}
</style>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
</head>
<body>
<div id="top">
  <div class="title">Gulab Vastu Chakra</div>
  <button onclick="document.getElementById('file').click()">🗺️ Map</button>
  <button onclick="resetApp()">🔄 Reset</button>
  <button onclick="saveGgb()">💾 Save</button>
</div>
<input id="file" type="file" accept="image/*">
<div id="ggb"></div>
<div id="hint"></div>
